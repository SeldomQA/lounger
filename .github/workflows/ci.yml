# Lounger CI (docs/development_plan.md §3.2 / §5.2)
name: CI

on: [push, pull_request]

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (dev extras)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check lounger tests
      - name: Type check (mypy)
        run: mypy lounger --ignore-missing-imports
      - name: Unit tests
        run: pytest tests/ -m "not integration" -q

  web:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (dev extras)
        run: pip install -e ".[dev]"
      - name: Install chromium
        run: playwright install --with-deps chromium
      - name: Playwright smoke test
        run: pytest tests/test_playwright_smoke.py -q
