# Pre-commit hooks for lounger (docs/development_plan.md P2)
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [check, --fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        # line-length mirrors [tool.black] in pyproject.toml
        args: [--line-length, "120"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies:
          - types-PyYAML
          - types-requests
        # mypy reads [tool.mypy] from pyproject.toml; po.py is skipped there
        files: ^lounger/.*\.py$
        exclude: ^lounger/po\.py$
