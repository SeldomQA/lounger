[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "lounger"
version = "1.5.1"
description = "Next generation automated testing framework."
readme = "README.md"
authors = [
    { name = "bugmaster", email = "defnngj@gmail.com" }
]

requires-python = ">=3.10, <4.0"

# 核心依赖：pytest 插件 + yaml + click（3.11 收敛后主依赖只保留核心）
# DB / AI / Playwright 全部下沉到 [project.optional-dependencies] extras
dependencies = [
    "PyYAML>=6.0.2,<7.0.0",
    "openpyxl>=3.1.5,<3.2.0",
    "click>=8.1.7,<9.0.0",
    "pytest-req>=0.5.0",
    "pytest-xhtml>=0.6.1",
    "pytest-rerunfailures>=14.0,<15.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "centrifuge-python>=0.4.1,<0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "mypy",
    "pre-commit",
    "playwright",
    "pytest-playwright>=0.8.0,<0.9.0",
]
db-mysql = ["PyMySQL>=1.1.1,<2.0.0"]
db-mssql = ["pymssql>=2.2"]
db-postgres = ["psycopg2-binary>=2.9"]
db-ssh = ["fabric>=3.2.2,<4.0.0"]
ai = ["autowing>=0.8.1,<0.9.0"]

[project.urls]
repository = "https://github.com/SeldomQA/lounger"
homepage = "https://github.com/SeldomQA/lounger"

[project.scripts]
lounger = "lounger.cli:main"

[project.entry-points."pytest11"]
lounger = "lounger.plugin"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# 核心规则集：pycodestyle 关键错误 + pyflakes + import 排序
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
# 与 ruff line-length 对齐（P2 代码风格）
line-length = 120
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
# 第三方库无 stub 时忽略其导入错误（playwright/pytest_req 等）
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
# po.py 依赖 playwright 私有 _impl 类型且大量动态 action 赋值（3.9 已用
# __getattr__ 治理），mypy 无法完整建模——整体跳过类型检查
module = "lounger.po"
ignore_errors = true

[tool.pytest.ini_options]
# pytest tests/ = 单元级（默认）；pytest -m integration = 外部依赖级（3.1 约定）
markers = [
    "integration: tests requiring external dependencies (browser, database, network)",
]
